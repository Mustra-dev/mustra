# The checks CONTRIBUTING.md asks for, enforced. Tests run on Linux and
# macOS because the agent has platform-specific code paths and a suite that
# only passes on the maintainer's OS is a suite nobody else can trust.
#
# Where jobs run: pushes, and pull requests from branches of this
# repository, run on the maintainers' self-hosted runners (labels
# mustra-linux, mustra-windows, mustra-mac; mustra-e2e in e2e.yml). A pull
# request from a fork never does: its jobs run on GitHub's hosted machines,
# so code from outside the project never reaches a maintainer's network.
# The macOS test leg and the Windows agent and sensor jobs run when the
# change can affect them: the agent's packages, OS-specific files, a go.mod
# requirement the agent builds with, or this workflow's jobs that run there
# (the changes job decides, see .github/scripts/changes.sh). Every package is still
# cross-compiled for Windows and macOS on every run. A manual run
# (workflow_dispatch) runs everything against main. A job skipped by `if:`
# counts as passing for a required status check, so keep that in mind if
# branch protection gains one.
#
# Supply-chain rules for this file (and release.yml):
# - Every action is pinned to a full commit SHA, with the release tag in a
#   comment. Dependabot (.github/dependabot.yml) proposes the bumps.
# - The token has no permissions by default; each job asks for what it uses.
# - Checkouts do not keep the token in .git/config, since nothing here pushes.
# - Only main writes the Actions cache (Go caches and BuildKit's gha layer
#   cache); other refs restore main's. A pull request's entries are visible
#   to that pull request alone, and saving them overflowed the 10 GB limit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in
# progress, on main too: nothing consumes main's results (release.yml runs
# on tags), and the latest commit of a burst is still tested in full. The
# event is part of the group so a push cannot cancel a manual full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: changed paths
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","mustra-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      agent: ${{ steps.changes.outputs.agent }}
      script_tools: ${{ steps.changes.outputs.script_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff needs the pull request's base, or the push's "before".
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/changes.sh

  # The Linux leg always runs. The macOS leg runs unless the changes job
  # answered a definite "false": if that job fails, this one still runs
  # (!cancelled()) with the full matrix.
  check:
    name: lint and test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    # The macOS leg also runs the macOS sensor execution test (below)
    # instead of a separate go-sensors leg. The self-hosted Mac is not
    # always on; a job for it waits until it is. A fork's pull request uses
    # GitHub's Intel Macs (its Apple Silicon ones were too busy to start).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'macos' && fromJSON('["self-hosted","macOS","ARM64","mustra-mac"]') || fromJSON('["self-hosted","Linux","X64","mustra-linux"]')) || (matrix.os == 'macos' && 'macos-15-intel' || matrix.os) }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.agent != 'false' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on disk between runs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needs to run on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # The agent runs as a Windows service on real fleets, and the server
      # has to build everywhere too: compile every package for Windows and
      # macOS on every run. The repository has no cgo, so a Linux
      # cross-compile fails exactly where a Windows runner would (it
      # reproduces the syscall.Kill break fixed in 7ce79e4). Not `go vet`:
      # GOOS=windows vet still flags tray_windows.go's unsafe.Pointer use.
      - name: Cross-compile for Windows and macOS
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - run: go test ./...
      # go-sensors' macOS leg, folded in here: see runs-on.
      - name: Go sensor execution
        if: runner.os == 'macOS'
        run: go test ./internal/sensorbuild ./internal/agent -run 'TestBuildAndRun|TestGoSensor'
        env:
          MUSTRA_GO_BUILD_TEST: '1'

  # The tests that need Postgres skip without MUSTRA_TEST_*_DSN, so the
  # check job never ran them: a failure there went unseen on main for days
  # (TestListOIDCProvidersMasksClientSecret). A throwaway Postgres runs as
  # a service container next to this job, one database per test family (two of them reset their schema or
  # need an empty one). -p 1: the packages share the deploy database.
  db-tests:
    name: database tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","mustra-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # The version deploy/docker-compose.yml runs.
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: mustra-ci
          POSTGRES_DB: deploy
        # No fixed host port, so jobs on one machine cannot collide.
        ports: ["5432/tcp"]
        # Ask over TCP: while creating POSTGRES_DB the image's entrypoint
        # runs a socket-only server and then stops it, and a socket check
        # passes against that one, so the next step met "the database
        # system is shutting down".
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Create the scratch databases
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          for db in setup sensor restore; do
            docker exec "$PG_ID" psql -h 127.0.0.1 -U postgres -qc "CREATE DATABASE $db"
          done
      - name: Database tests
        timeout-minutes: 20
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          base="postgres://postgres:mustra-ci@127.0.0.1:${PGPORT}"
          export MUSTRA_TEST_DEPLOY_DSN="$base/deploy?sslmode=disable"
          export MUSTRA_TEST_SETUP_DSN="$base/setup?sslmode=disable"
          export MUSTRA_TEST_SENSOR_DSN="$base/sensor?sslmode=disable"
          export MUSTRA_TEST_RESTORE_DSN="$base/restore?sslmode=disable"
          go test -p 1 -count=1 ./internal/store/... ./internal/server/...

  dco:
    # CONTRIBUTING.md requires a Developer Certificate of Origin sign-off on
    # every commit. Check it here instead of relying on reviewers to notice:
    # the sign-off must name the commit's author email, as `git commit -s`
    # writes it.
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","mustra-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email="$(git log -1 --format=%ae "$c")"
            if ! git log -1 --format=%B "$c" | grep -i '^Signed-off-by: ' | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by for <$email>"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff $BASE_SHA' to fix existing commits)."
            exit 1
          fi

  image:
    # The same binaries supply downloads and the image; no second Go build
    # inside Docker, and both server architectures are checked on every PR.
    #
    # The binaries are deliberately NOT uploaded as a workflow artifact.
    # Nothing downloads them (E2E's deployment build compiles from source
    # and releases attach their own), and at ~265 MB a run they blew through
    # the repository's artifact storage allowance in two days. The buildx build record is skipped
    # for the same reason.
    name: build image
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","mustra-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-binaries
        with:
          version: ci-${{ github.sha }}
          agent-version: ci-${{ github.sha }}
      # The runtime image's apk upgrade runs on arm64 too.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # Every build names this job's own builder. setup-buildx also makes it
      # the "current" builder, which self-hosted runners on one machine share:
      # a build that relied on it once ran on a parallel job's builder and
      # died when that job removed it (v0.95.2).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: bin
          file: deploy/Dockerfile.image
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=runtime-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=runtime-image' || '' }}

  script-tools:
    name: script editor and language engines
    # Runs when one of its inputs changed (see changes.sh), or if the
    # changes job could not say. E2E still builds this image on every run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.script_tools != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","mustra-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The project's one Node version: the major of
      # deploy/Dockerfile.script-tools. Dependabot bumps that image, not
      # this line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --prefix tools/script-editor
      - run: npm test --prefix tools/script-editor
      - run: npm run build --prefix tools/script-editor
      - run: git diff --exit-code -- internal/server/static/vendor/
      # Every build names this job's own builder. setup-buildx also makes it
      # the "current" builder, which self-hosted runners on one machine share:
      # a build that relied on it once ran on a parallel job's builder and
      # died when that job removed it (v0.95.2).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/Dockerfile.script-tools
          load: true
          tags: mustra-script-tools:test
          cache-from: type=gha,scope=script-tools-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=script-tools-image' || '' }}
      - name: Test actual language engines in isolation
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=1024m \
            --memory 1536m --pids-limit 192 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e MUSTRA_SCRIPT_TOOLS_INTEGRATION=1 \
            mustra-script-tools:test node --test '*.test.js'

  agent-windows:
    # The agent's own tests, natively on Windows, for agent changes. The
    # install, update and recovery paths are drilled on real hosts instead
    # (docs/DEVELOPMENT.md).
    name: agent tests (windows)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.agent != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Windows","X64","mustra-windows"]') || 'windows-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./internal/agent/... ./cmd/agent/... ./internal/selfservice/... ./internal/updatesig/...

  go-sensors:
    # Linux always; Windows for agent changes. The macOS run is a step of
    # check's macOS leg.
    name: Go sensor execution (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'windows-latest' && fromJSON('["self-hosted","Windows","X64","mustra-windows"]') || fromJSON('["self-hosted","Linux","X64","mustra-linux"]')) || matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.agent != 'false' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: go test ./internal/sensorbuild ./internal/agent -run 'TestBuildAndRun|TestGoSensor'
        env:
          MUSTRA_GO_BUILD_TEST: '1'
      - if: runner.os == 'Linux'
        run: go test ./internal/sensorbuild -run TestSixTargets -timeout 10m
        env:
          MUSTRA_GO_CROSS_TEST: '1'
