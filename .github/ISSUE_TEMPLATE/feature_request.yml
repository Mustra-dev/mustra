name: Feature request
description: Propose a new capability or a change in behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check docs/ROADMAP.md and the existing issues first; the idea may already
        be planned or discussed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do with your fleet, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like mustra to do. Mention the console pages, sensors or platforms involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and permissions
      description: Does this run code on endpoints, expose data or need a new permission? Who should be allowed to use it?
