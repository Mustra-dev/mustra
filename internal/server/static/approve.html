<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approve — mustra</title>
<link rel="icon" href="/static/brand/favicon.ico" sizes="any">
<link rel="icon" href="/static/brand/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/app-icon-256.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<style>
  .ap-card { max-width: 560px; margin: 8px auto 0; }
  .ap-title { font-size: 18px; font-weight: 650; line-height: 1.35; margin: 2px 0 12px; }
  .ap-facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13.5px; margin-bottom: 16px; }
  .ap-facts .k { color: var(--text-muted); }
  .ap-facts .v { overflow-wrap: anywhere; }
  .ap-state { display: inline-block; font-size: 12px; font-weight: 650; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); margin-bottom: 12px; }
  .ap-state.pending { background: color-mix(in srgb, var(--viz-warning) 22%, transparent); color: var(--warn); }
  .ap-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .ap-buttons button { flex: 1 1 160px; min-height: 48px; font-size: 15px; font-weight: 650; }
  .ap-buttons button.deny { background: color-mix(in srgb, var(--viz-danger, #e5484d) 85%, black); border-color: transparent; color: #fff; }
  .ap-note { width: 100%; margin-bottom: 12px; }
  .ap-result { margin-top: 14px; font-size: 14px; }
  .ap-result.ok { color: var(--ok); } .ap-result.bad { color: var(--viz-danger, #e5484d); }
  .muted { color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar-rail" id="sidebar-rail"></aside>
    <aside class="sidebar-flyout" id="sidebar-flyout"></aside>
    <main>
      <div class="panel ap-card" id="ap-card"><p class="muted">loading…</p></div>
    </main>
  </div>

<script src="/static/app.js"></script>
<script>
// Opened from a chat message's Approve or Deny button. Nothing is decided
// until a button here is pressed; the wanted decision is only highlighted.
const q = new URLSearchParams(location.search);
const wanted = q.get("decision");
let info = null;

document.addEventListener("mustra:user", load);

async function load() {
  const card = document.getElementById("ap-card");
  const r = await fetch(`/api/approve-info?kind=${encodeURIComponent(q.get("kind") || "")}&id=${encodeURIComponent(q.get("id") || "")}`);
  if (!r.ok) { card.innerHTML = `<p class="ap-result bad">${escapeHtml(await r.text())}</p>`; return; }
  info = await r.json();
  const facts = (info.facts || []).map(([k, v]) => `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div>`).join("");
  card.innerHTML = `
    <div class="muted">${escapeHtml({ jump: "Jump Gate access request", approval: "Approval request", playbook: "Playbook approval", cert: "Certificate renewal" }[info.kind] || info.kind)}</div>
    <div class="ap-title">${escapeHtml(info.title)}</div>
    <span class="ap-state ${info.pending ? "pending" : ""}">${escapeHtml(info.pending ? "waiting for a decision" : info.state)}</span>
    <div class="ap-facts">${facts}</div>
    ${info.pending ? `
      ${info.can_deny ? '<input class="ap-note" id="ap-note" placeholder="Note (optional)">' : ""}
      <div class="ap-buttons">
        <button class="primary" id="ap-approve">${escapeHtml(info.kind === "cert" ? "Approve and renew now" : "Approve")}</button>
        ${info.can_deny ? '<button class="deny" id="ap-deny">Deny</button>' : ""}
      </div>` : '<p class="muted">Already decided — nothing to do here.</p>'}
    <div class="ap-result" id="ap-result"></div>
    <p class="muted u-mt-16"><a href="${escapeHtml(safeUrl(info.console_link))}">Open in the console</a></p>`;
  if (!info.pending) return;
  const focus = document.getElementById(wanted === "deny" ? "ap-deny" : "ap-approve");
  if (focus) focus.focus();
  document.getElementById("ap-approve").addEventListener("click", () => decide(info.approve_body));
  const deny = document.getElementById("ap-deny");
  if (deny) deny.addEventListener("click", () => decide(info.deny_body));
}

async function decide(bodyText) {
  const res = document.getElementById("ap-result");
  document.querySelectorAll(".ap-buttons button").forEach(b => { b.disabled = true; });
  res.className = "ap-result"; res.textContent = "sending…";
  const body = JSON.parse(bodyText || "{}");
  const note = document.getElementById("ap-note");
  if (note && note.value.trim()) body.note = note.value.trim();
  const r = await fetch(info.decide_url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.ok) {
    res.className = "ap-result ok"; res.textContent = "Done.";
    setTimeout(load, 800);
  } else {
    res.className = "ap-result bad"; res.textContent = "Failed: " + await r.text();
    document.querySelectorAll(".ap-buttons button").forEach(b => { b.disabled = false; });
  }
}
</script>
</body>
</html>
