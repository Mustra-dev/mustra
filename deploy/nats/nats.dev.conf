# NATS for local development only: JetStream on, no TLS, no authentication,
# bound to localhost by compose.dev.yml. The production configuration is
# nats.conf; the reasons it has TLS and two credentials are written there,
# and every one of them applies the moment this port is reachable from
# another machine.

port: 4222
monitor_port: 8222
max_payload: 8MB

jetstream {
  store_dir: "/data"
}
