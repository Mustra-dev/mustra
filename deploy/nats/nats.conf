# NATS configuration for the mustra control plane.
#
# This channel is the control plane. Sensor snapshots travel one way; in the
# other travel commands that run as root on every managed endpoint. TLS
# closes the reading half. Authentication — per endpoint, below — closes the
# writing half, which is the one that matters.

port: 4222
monitor_port: 8222
# Frozen Deploy plans carry scripts, sensor schemas, and dependency definitions.
max_payload: 8MB

jetstream {
  store_dir: "/data"
}

tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file:  "/etc/nats/certs/server.key"
  # Agents verify the server against the CA they were installed with; the
  # server does not require client certificates. Client identity is the
  # per-agent credential decided by the auth callout below.
  verify: false
  timeout: 5
}

authorization {
  # The server is the one static account. It publishes commands and reads
  # everything, so it gets full permissions, and it bypasses the callout
  # (auth_users below) because it is the callout.
  #
  # Except where only agents publish. The server answers agents' requests,
  # and a reply subject is chosen by the requester but published with the
  # responder's rights; the server checks every reply subject
  # (internal/server/agent_reply.go), and these denies make sure that even
  # a reply it failed to check can never land on another agent's reports,
  # registration, query results or requests. Keep the list equal to
  # internal/nats ServerPublishDeny (TestNATSConfServerDeniesAgentSubjects).
  users: [
    { user: "mustra-server", password: $MUSTRA_NATS_SERVER_PASSWORD,
      permissions: {
        publish: {
          allow: [">"]
          deny: [
            "beacon.agent.>", "beacon.register", "beacon.register.>", "beacon.r.>",
            "beacon.patchlist.>", "beacon.selfservice.>", "beacon.customsensors.>",
            "beacon.telemetry.>",
            "beacon.enroll.>"
          ]
        }
        subscribe: { allow: [">"] }
      }
    }
  ]

  # Every other connection is decided by the control plane.
  #
  # This used to be one shared "mustra-agent" user for the whole fleet,
  # whose permissions had the agent ID as a "*" wildcard: anyone holding
  # that one password — and the install script handed it to anyone who
  # asked — could publish as any agent, subscribe to every agent's
  # commands and shell sessions, and read every reply on _INBOX.>.
  #
  # Now nats-server sends each connection's username and password to the
  # mustra server ($SYS.REQ.USER.AUTH), which answers with a user JWT
  # signed by the account key below and scoped to the one identity the
  # connection proved (internal/server/natsauth_callout.go; the permission
  # sets are built in internal/nats/permissions.go from the subject
  # builders, so the two cannot drift):
  #
  #   <agent id> + its secret      An enrolled agent. Publish only on its
  #                                own subjects: beacon.register.<id>,
  #                                beacon.agent.<id>.{heartbeat,facts,
  #                                sensor.*,actionresult,fileevents,
  #                                procevents,recevents}, beacon.r.*.<id>,
  #                                beacon.{patchlist,selfservice,
  #                                customsensors}.<id>,
  #                                beacon.telemetry.<id>.metrics, and JetStream
  #                                INFO only (never $JS.API.> — that would
  #                                let an agent delete the fleet's stream).
  #                                Subscribe only beacon.cmd.<id>,
  #                                beacon.shell.<id>, beacon.q.all,
  #                                beacon.q.os.*, beacon.q.site.>,
  #                                beacon.q.agent.<id> and its private
  #                                inbox _INBOX_<id>.>. Replies to the
  #                                server's requests via allow_responses
  #                                (one reply per request). JWT lives 1h.
  #   mustra-enroll:<nonce>        A new agent presenting an enrollment
  #     + enrollment token         token. May only publish
  #                                beacon.enroll.token and read
  #                                _INBOX_ENROLL_<nonce>.>. Lives 2 min.
  #   mustra-legacy-enroll:<nonce> Refused. The shared password every agent
  #   mustra-agent + legacy pw     once held is retired; the callout turns
  #                                both away, whatever the password.
  #
  # Every subject an agent publishes on must be in its set, or the publish
  # goes unacked at the head of its ordered outbox and blocks everything
  # queued behind it; TestAgentPermissionsCoverPublishedSubjects checks it.
  #
  # The issuer is the public half of the account nkey whose seed the server
  # holds (MUSTRA_NATS_CALLOUT_SEED); deploy/init.sh generates both.
  auth_callout {
    issuer: $MUSTRA_NATS_CALLOUT_ISSUER
    # mustra-sys (below) bypasses the callout too: it is the server's way
    # into the system account, so the callout cannot be what admits it.
    auth_users: [ "mustra-server", "mustra-sys" ]
  }
}

# The system account, for one purpose: when an agent's credential is
# revoked, the server lists that agent's connections and closes them
# ($SYS.REQ.SERVER.PING.CONNZ, $SYS.REQ.SERVER.<id>.KICK), so the agent is
# cut off at once instead of when its JWT expires (an hour). Its reconnect
# goes through the callout, which refuses it. The server connects as
# mustra-sys only for that, and disconnects again.
#
# MUSTRA_NATS_SYS_PASSWORD is in .env (init.sh adds it). When it is unset
# the container starts NATS with a random one (docker-compose.yml), so
# this user can never have an empty password; revocation then waits for
# the JWT to expire, as before.
accounts {
  SYS: {
    users: [ { user: "mustra-sys", password: $MUSTRA_NATS_SYS_PASSWORD } ]
  }
}
system_account: SYS
